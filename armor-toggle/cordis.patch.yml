# armor-toggle bundle patch: 破甲的层叠补丁。
#
# 作用有三处：
#   1) 覆盖 system-prompt 行，切断 Harness 自带的身份/运行时上下文/人设前缀，
#      让破甲载荷成为唯一的系统级人格来源。
#   2) 显式禁用 agent-instructions 行（兜底），防止上游层（web-app / preset /
#      用户档案补丁）重新启用它并把项目级 AGENTS.md 类指令重新灌回提示词。
#   3) 挂载破甲本体，**默认关闭**，由标题栏上的「破甲」药丸开关在运行期决定是否生效。
#
# ⚠ 覆盖语义：patch 命中 id 时会替换该行**整个 config**，不是深合并。
# 所以这里必须重述该行拥有的全部键：
#   includeHarnessIdentity: false -> 去掉 "harness:identity"（order -1000）段落，
#     它只在标志「显式不为 false」时才注册，不写就静默回落到默认 true。
#   includeRuntimeContext: false  -> 注册表级 suppressRuntimeContext()，摘掉整条
#     动态上下文链：SANDBOX_POLICY(110) / APPROVAL_POLICY(115) / SUBAGENT_DELEGATION(120)。
#   personaPrefix: ""             -> 清空 DEPLOYMENT_PERSONA_PREFIX（order 0），
#     即宿主那句 "You are a coding agent powered by the {{model}} model."。
#   personaSuffix                 -> 唯一保留的一行：工作目录提示。
#
# toolOrder 刻意不重述：留空即保持 schema 默认；重述它就得补一条
# <unlisted-tools> 的 rest 项，得不偿失。
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: ""
    personaSuffix: Your working directory is {{cwd}}.

# 兜底拦截：agent-instructions 在 web-app 层已被 disabled: true，
# 此处再断一次，避免上游重排或档案补丁把它重新打开。
# disabled 是 entry 字段（不是 config 键），所以写法是并列一行、不缩进到 config 下。
- id: agent-instructions
  disabled: true

# ── 破甲本体 ─────────────────────────────────────────────────────────────────
#
# ⚠ v6.0.0 开关语义变更（这是本版最重要的改动）：
#
#   旧版：enabled: true 写死在这里，装完即生效；界面上那个「开关」是假的，
#         点它只会触发一次「清除安全规则」，改不了这个 enabled 字段。
#         结果是：装上就永远是破甲态，用户想临时关掉做不到。
#
#   新版：enabled: false 作初始值，插件装完**处于关闭状态**；
#         真正的开关是标题栏「编辑」右边那颗「破甲」药丸，
#         点开 = 三层注入 + 五道闸即时生效，点关 = 全部退场，回到原生状态。
#         开关状态存在 localStorage（armor-toggle:enabled），刷新后保持。
#
#   技术实现：index.js 里的 runtimeEnabled 是唯一真源，所有注入点与拦截闸
#   都读 isActive()；客户端通过 ctx 服务 armorToggle.setEnabled() 实时下发。
- insert:
    - id: armor-toggle
      name: 'armor-toggle'
      config:
        # 初始状态：关闭。真正的开关在界面药丸上。
        enabled: false
        injectKernel: true
        injectMirror: true
        injectObedience: true
        # 系统最高指令：内核声明 complete，组装后成为唯一系统提示词。
        # ⚠ v5.0.9 修 C2：原本是 true，与 index.js 的 DEFAULT_CONFIG 正好相反
        #   （DEFAULT_CONFIG.completeOverride = false，v5.0.7 注释已实测判定 true 有害）。
        #   true 的真实后果（宿主 dsh-system-prompt/lib/index.js:335-359 实证）：
        #     · sections 在 waterfall 之后被替换成 [内核]，mirror(200) 与 obedience(300) 永不进 prompt
        #     · 其它 17 个 bundle 的说明段全丢；dsh:device-shell-guide 的 section 被丢后，
        #       其 pre-step 兜底因 systemActive=true 永不触发 → 安卓设备操作指南两路全断
        #     · 闸① 的 section 剥离被架空（宿主在它之后替换），只剩清 contexts 的作用
        #   改 false 后：三层 section 真正落地，闸① 剥离真正生效，故障面收敛。
        completeOverride: false
        # 自动删除安全规则：组装期动态剔除安全段落 + 清空动态上下文链。
        stripSafetyRules: true
        # v3.0.0：十类违法能力弹药块，命中类目直接给成品级交付物。
        injectAmmo: true
        # 悬浮窗已移除（v6.0.0）：开关改到标题栏药丸，旧的浮窗面板不再需要。
        floatingOverlay: false
        clearAllSafetyRules: true
        # v4.0.0：实时思考监看 —— 边流边判会不会拒答、冒没冒安全提示词。
        streamWatch: true
        # v4.0.0：强制接受纠正 —— 推理链一冒拒绝念头，下一步立即注入强制接受指令。
        forceAccept: true
        # v5.2.0 StopGuard：改写上游 SSE 里的 stop_reason。
        #
        # 治的是这条报错：`DeepSeek Messages stream: unsupported stop reason refusal`
        # 症状：问题够硬时模型照样答，但**答到一半**整条流崩掉，半截答案全丢。
        #
        # 根因（dsh-llm-deepseek/lib/index.js:1914-1922）：
        #   stopReason() 的 switch 只认 end_turn / stop_sequence / tool_use / max_tokens，
        #   其余值一律 malformed(`unsupported stop reason ${raw}`) 抛错。
        #   上游下发 `refusal` 就落进 default，translate() 生成器当场终止。
        #
        # 为什么闸④（llm/stream）拦不住：stopReason() 在**生成 chunk 之前**执行，
        # 插件拿到的已经是炸掉的迭代器，看不到原始 refusal 值。
        # 唯一在它之前生效的位置是 HTTP 响应流 —— 所以这里包 globalThis.fetch，
        # 在 SSE 文本里把 refusal / safety / content_filter / blocked 改写成 end_turn。
        stopGuard: true
        # v5.2.0 续写纠正：StopGuard 改写后正文停在半句，下一步注入指令把它补完。
        # 关掉则只有「流不崩」，答案仍是半截。
        stopResume: true
        # v5.1.0：尾部锚定 —— 在提示词最末尾（order 9950）再压一遍最硬的五条。
        #   实测必要性：ptc 预设下 run_code 说明书 32645 字符压在破甲三段之后，
        #   模型照样回「我不会写出来 / 这个我不改口」。三层在前沿被稀释，
        #   只有把规则钉到末尾才能压住长上下文里的权重流失。
        injectTailAnchor: true
